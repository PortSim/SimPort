<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
    <!-- Background -->
    <rect x="0" y="0" width="200" height="200" fill="#ffccd5"/>

    <!-- Vertical line -->
    <line x1="100" y1="160" x2="100" y2="100" stroke="#f06292" stroke-width="16"/>

    <!-- Horizontal line -->
    <line x1="40" y1="100" x2="160" y2="100" stroke="#f06292" stroke-width="16"/>

    <!-- Horizontal line left stub -->
    <line x1="40" y1="80" x2="40" y2="120" stroke="#f06292" stroke-width="16"/>

    <!-- Arrow at bottom -->
    <polygon points="0,-15 0,15 30,0"
             fill="#f06292"
             transform="translate(100,150) rotate(90)"/>

    <!-- Arrow at right -->
    <polygon points="0,-15 0,15 30,0"
             fill="#f06292"
             transform="translate(150,100) rotate(0)"/>

</svg>
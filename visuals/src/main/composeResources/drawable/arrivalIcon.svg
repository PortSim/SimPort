<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
    <!-- Background -->
    <rect x="0" y="0" width="200" height="200" fill="#cce5ff"/>

    <!-- Incoming arrow -->
    <line x1="40" y1="100" x2="160" y2="100" stroke="#0077cc" stroke-width="16"/>

    <!-- Central hub -->
    <circle cx="0" cy="100" r="80" fill="#0077cc"/>
    <circle cx="0" cy="100" r="64" fill="#cce5ff"/>
    <circle cx="0" cy="100" r="48" fill="#0077cc"/>

    <!-- Arrow -->
    <polygon points="150,115 150,85 180,100"
             fill="#0077cc"
             stroke="#0077cc"/>

</svg>
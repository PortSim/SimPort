<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
    <!-- Background -->
    <rect x="0" y="0" width="200" height="200" fill="#449a21" stroke-width="2"/>

    <line x1="70" y1="100" x2="160" y2="100" stroke="#0e3a12" stroke-width="16"/>
    <polygon points="0,-15 0,15 30,0"
             fill="#0e3a12"
             transform="translate(150,100) rotate(0)"/>
    <!-- Left circle -->
    <circle cx="90" cy="100" r="42" fill="#0e3a12"/>
    <circle cx="90" cy="100" r="26" fill="#449a21"/>

    <!-- Horizontal line + left inner circle -->
    <!-- Arrow at right -->
    <polygon points="0,0 0,200 60,200 90,100 60,0"
             fill="#449a21"/>
    <line x1="40" y1="100" x2="90" y2="100" stroke="#0e3a12" stroke-width="16"/>
    <circle cx="90" cy="100" r="14" fill="#0e3a12"/>

    <!-- vertical line left -->
    <line x1="40" y1="70" x2="40" y2="130" stroke="#0e3a12" stroke-width="16"/>




</svg>
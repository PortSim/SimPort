<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">

    <rect x="0" y="0" width="200" height="200" fill="#ffad33"/>

    <!-- Incoming line -->
    <line x1="40" y1="100" x2="120" y2="100" stroke="#aa5500" stroke-width="16"/>

    <!-- Vertical line -->
    <line x1="40" y1="80" x2="40" y2="120" stroke="#aa5500" stroke-width="16"/>

    <!-- Split lines -->
    <line x1="110" y1="100" x2="160" y2="60" stroke="#aa5500" stroke-width="16"/>
    <line x1="110" y1="100" x2="160" y2="140" stroke="#aa5500" stroke-width="16"/>

    <!-- Arrow 1 -->
    <polygon points="0,-15 0,15 30,0"
             fill="#aa5500"
             transform="translate(150,67.5) rotate(-38.7)"/>

    <!-- Arrow 2 -->
    <polygon points="0,-15 0,15 30,0"
             fill="#aa5500"
             transform="translate(150,132.5) rotate(38.7)"/>

</svg>
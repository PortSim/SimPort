<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
    <rect x="0" y="0" width="200" height="200" fill="#ffad33" stroke-width="2"/>

    <!-- Incoming line -->
    <line x1="40" y1="100" x2="120" y2="100" stroke="#aa5500" stroke-width="16"/>
    <!-- Vertical line -->
    <line x1="40" y1="80" x2="40" y2="120" stroke="#aa5500" stroke-width="16"/>

    <!-- Split lines -->
    <line x1="110" y1="100" x2="160" y2="60" stroke="#aa5500" stroke-width="16"/>
    <line x1="110" y1="100" x2="160" y2="140" stroke="#aa5500" stroke-width="16"/>

    <!-- Optional nodes at ends -->
    <circle cx="160" cy="60" r="14" fill="#aa5500"/>
    <circle cx="160" cy="140" r="14" fill="#aa5500"/>
</svg>
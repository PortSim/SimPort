<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
    <!-- Background: soft red -->
    <rect x="0" y="0" width="200" height="200" fill="#ff4044"/>

    <!-- Incoming line -->
    <line x1="40" y1="100" x2="70" y2="100" stroke="#900000" stroke-width="16"/>

    <!-- Vertical Lines -->
    <line x1="70" y1="70" x2="70" y2="130" stroke="#900000" stroke-width="16"/>
    <line x1="100" y1="50" x2="100" y2="150" stroke="#900000" stroke-width="16"/>
    <line x1="130" y1="70" x2="130" y2="130" stroke="#900000" stroke-width="16"/>

    <!-- Outgoing line -->
    <line x1="130" y1="100" x2="160" y2="100" stroke="#900000" stroke-width="16"/>
    <circle cx="160" cy="100" r="14" fill="#900000"/>

    <line x1="40" y1="80" x2="40" y2="120" stroke="#900000" stroke-width="16"/>

</svg>
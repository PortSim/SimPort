<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
    <!-- Background: soft red -->
    <rect x="0" y="0" width="200" height="200" fill="#ff4044"/>

    <!-- Incoming line -->
    <line x1="40" y1="100" x2="70" y2="100" stroke="#900000" stroke-width="16"/>

    <!-- Vertical Lines -->
    <line x1="100" y1="60" x2="100" y2="140" stroke="#900000" stroke-width="80"/>

    <!-- Outgoing line -->
    <line x1="130" y1="100" x2="160" y2="100" stroke="#900000" stroke-width="16"/>
    <!-- Arrow at right -->
    <polygon points="0,-15 0,15 30,0"
             fill="#900000"
             transform="translate(150,100) rotate(0)"/>

    <line x1="40" y1="80" x2="40" y2="120" stroke="#900000" stroke-width="16"/>

    <!-- Clock circle (bigger) -->
    <circle cx="100" cy="100" r="25" fill="#ff4044" stroke="#900000" stroke-width="8"/>

    <!-- Clock hands -->
    <line x1="100" y1="82" x2="100" y2="102" stroke="#900000" stroke-width="8"/>
    <line x1="100" y1="100" x2="115" y2="110" stroke="#900000" stroke-width="8"/>

    <!-- Hour ticks inside the clock -->
    <g stroke="#900000" stroke-width="2">
        <!-- 12 ticks, rotated around the center -->
        <line x1="100" y1="115" x2="100" y2="118"/>
        <line x1="100" y1="115" x2="100" y2="118" transform="rotate(30 100 100)"/>
        <line x1="100" y1="115" x2="100" y2="118" transform="rotate(60 100 100)"/>
        <line x1="100" y1="115" x2="100" y2="118" transform="rotate(90 100 100)"/>
        <line x1="100" y1="115" x2="100" y2="118" transform="rotate(120 100 100)"/>
        <line x1="100" y1="115" x2="100" y2="118" transform="rotate(150 100 100)"/>
        <line x1="100" y1="115" x2="100" y2="118" transform="rotate(180 100 100)"/>
        <line x1="100" y1="115" x2="100" y2="118" transform="rotate(210 100 100)"/>
        <line x1="100" y1="115" x2="100" y2="118" transform="rotate(240 100 100)"/>
        <line x1="100" y1="115" x2="100" y2="118" transform="rotate(270 100 100)"/>
        <line x1="100" y1="115" x2="100" y2="118" transform="rotate(300 100 100)"/>
        <line x1="100" y1="115" x2="100" y2="118" transform="rotate(330 100 100)"/>
    </g>

</svg>
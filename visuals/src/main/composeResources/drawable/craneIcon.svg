<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
    <!-- Background -->
    <rect x="0" y="0" width="200" height="200" fill="#cce5ff"/>

    <!-- Incoming arrow -->
    <line x1="20" y1="70" x2="180" y2="70" stroke="#0077cc" stroke-width="16"/>

    <!-- Optional nodes -->
    <line x1="130" y1="20" x2="130" y2="180" stroke="#0077cc" stroke-width="24"/>

    <polygon points="80,0 200,0 200,80"
             fill="#cce5ff"/>

    <line x1="90" y1="170" x2="170" y2="170" stroke="#0077cc" stroke-width="32"/>

    <line x1="151" y1="55" x2="185" y2="55" stroke="#cce5ff" stroke-width="32"/>

    <!-- String -->
    <line x1="110" y1="10" x2="177" y2="55" stroke="#005499" stroke-width="8"/>
    <line x1="114" y1="10" x2="35" y2="70" stroke="#005499" stroke-width="8"/>
    <line x1="35" y1="102" x2="35" y2="70" stroke="#005499" stroke-width="8"/>


    <!-- crate -->
    <line x1="20" y1="100" x2="50" y2="100" stroke="#005499" stroke-width="24"/>

    <!-- overlay for outline -->
    <line x1="20" y1="70" x2="70" y2="70" stroke="#cce5ff" stroke-width="22"/>
    <line x1="20" y1="70" x2="70" y2="70" stroke="#0077cc" stroke-width="16"/>

    <line x1="155" y1="55" x2="185" y2="55" stroke="#005499" stroke-width="24"/>



</svg>
<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
    <!-- Background -->
    <rect x="0" y="0" width="200" height="200" fill="#C77DFF" stroke-width="2"/>

    <!-- Incoming line -->
    <line x1="40" y1="100" x2="160" y2="100" stroke="#5A189A" stroke-width="16"/>
    <!-- Vertical line -->
    <line x1="40" y1="80" x2="40" y2="120" stroke="#5A189A" stroke-width="16"/>


    <!-- Arrow -->
    <polygon points="150,115 150,85 180,100"
             fill="#5A189A"
             stroke="#5A189A"/>

    <!-- Clock circle (bigger) -->
    <circle cx="100" cy="100" r="25" fill="#C77DFF" stroke="#5A189A" stroke-width="8"/>

    <!-- Clock hands -->
    <line x1="100" y1="82" x2="100" y2="102" stroke="#5A189A" stroke-width="8"/>
    <line x1="100" y1="100" x2="115" y2="110" stroke="#5A189A" stroke-width="8"/>

    <!-- Hour ticks inside the clock -->
    <g stroke="#5A189A" stroke-width="2">
        <!-- 12 ticks, rotated around the center -->
        <line x1="100" y1="115" x2="100" y2="118"/>
        <line x1="100" y1="115" x2="100" y2="118" transform="rotate(30 100 100)"/>
        <line x1="100" y1="115" x2="100" y2="118" transform="rotate(60 100 100)"/>
        <line x1="100" y1="115" x2="100" y2="118" transform="rotate(90 100 100)"/>
        <line x1="100" y1="115" x2="100" y2="118" transform="rotate(120 100 100)"/>
        <line x1="100" y1="115" x2="100" y2="118" transform="rotate(150 100 100)"/>
        <line x1="100" y1="115" x2="100" y2="118" transform="rotate(180 100 100)"/>
        <line x1="100" y1="115" x2="100" y2="118" transform="rotate(210 100 100)"/>
        <line x1="100" y1="115" x2="100" y2="118" transform="rotate(240 100 100)"/>
        <line x1="100" y1="115" x2="100" y2="118" transform="rotate(270 100 100)"/>
        <line x1="100" y1="115" x2="100" y2="118" transform="rotate(300 100 100)"/>
        <line x1="100" y1="115" x2="100" y2="118" transform="rotate(330 100 100)"/>
    </g>

</svg>